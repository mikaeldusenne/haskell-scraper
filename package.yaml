name: haskellwebscrapper
version: 0.2.0.0
github: mikaeldusenne/haskell-scraper
license: BSD3
author: Mikaël Dusenne
synopsis: Resumable, staged HTML scraping
category: Web
description: See the README at <https://github.com/mikaeldusenne/haskell-scraper#readme>.

extra-source-files:
- README.md
- CHANGELOG.md
- docs/*.md
- examples/*.hs
- scripts/*.sh
- test/fixtures/**/*
- test/smoke.py

dependencies:
- base >= 4.18 && < 5
- bytestring
- directory
- filepath
- http-client >= 0.7 && < 0.8
- http-client-tls >= 0.3 && < 0.4
- http-types
- network-uri
- SHA
- tagsoup
- temporary
- text
- transformers

ghc-options: -Wall

library:
  source-dirs: src

executables:
  haskellwebscrapper-exe:
    main: Main.hs
    source-dirs: app
    ghc-options: -threaded -rtsopts
    dependencies: haskellwebscrapper

tests:
  haskellwebscrapper-test:
    main: Spec.hs
    source-dirs: test
    dependencies: haskellwebscrapper
